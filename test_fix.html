<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Fix</title>
    <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
</head>
<body>
    <h1>Test for HTML Entity Rendering Fix</h1>
    <textarea id="editor" style="width: 100%; height: 200px;">
# Test Document

This is a test for HTML entities.

- Item 1 with &amp; symbol
- Item 2 with < and > symbols
- Item 3 with quotes " and ' 

## Code Block Test

```javascript
console.log("Hello & welcome!");
var x = 5 < 10 && 10 > 5;
```

## Link Test

[Example Link](https://example.com?param=value&other=123)

## Table Test

| Header 1 | Header 2 |
|----------|----------|
| Cell 1 & Cell 2 | <test> data </test> |
| "Quoted" text | 'Single quoted' text |
    </textarea>
    <div id="preview" style="border: 1px solid #ccc; padding: 10px; margin-top: 10px;"></div>

    <script>
        // XSS防护工具 - 简化版本
        const XSSUtils = {
            escapeHtml: function(str) {
                if (typeof str !== 'string') {
                    str = String(str || '');
                }
                
                const entityMap = {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;',
                    '/': '&#x2F;',
                    '`': '&#x60;',
                    '=': '&#x3D;'
                };
                
                return str.replace(/[&<>"'`=\/]/g, function (s) {
                    return entityMap[s];
                });
            },
            
            escapeHtmlAttr: function(str) {
                if (typeof str !== 'string') {
                    str = String(str || '');
                }
                
                return str
                    .replace(/&/g, '&amp;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/\s/g, ' ');
            },

            sanitizeUrl: function(url) {
                if (typeof url !== 'string') {
                    return '';
                }
                
                if (url.toLowerCase().includes('javascript:') || 
                    url.toLowerCase().includes('vbscript:') ||
                    url.toLowerCase().includes('data:text/html') ||
                    url.toLowerCase().includes('onload') ||
                    url.toLowerCase().includes('onerror')) {
                    return '';
                }
                
                return url;
            },

            safeSetInnerHTML: function(element, content) {
                if (!element || !element.nodeType || element.nodeType !== 1) {
                    console.error('safeSetInnerHTML: 无效的DOM元素');
                    return;
                }
                
                if (typeof content !== 'string') {
                    content = String(content || '');
                }
                
                // 过滤危险内容，但保持HTML标签结构
                const sanitizedContent = this.sanitizeHtml(content);
                
                // 设置内容
                element.innerHTML = sanitizedContent;
            },

            sanitizeHtml: function(html) {
                // 移除潜在的危险标签和属性
                return html
                    // 移除script标签
                    .replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi, '')
                    // 移除on*事件处理器
                    .replace(/\s*on\w+\s*=\s*["'][^"']*["']/gi, '')
                    // 移除javascript:、vbscript:等危险协议
                    .replace(/(javascript:|vbscript:|data:text\/html)/gi, '')
                    // 移除表达式（CSS）
                    .replace(/expression\s*\(/gi, '');
            }
        };

        // 配置marked
        marked.setOptions({
            sanitize: false,
            silent: true,
            headerIds: false
        });

        // 更新预览
        function updatePreview() {
            const content = document.getElementById('editor').value;
            const html = marked.parse(content);
            XSSUtils.safeSetInnerHTML(document.getElementById('preview'), html);
        }

        // 监听输入事件
        document.getElementById('editor').addEventListener('input', updatePreview);

        // 初始渲染
        updatePreview();
    </script>
</body>
</html>
